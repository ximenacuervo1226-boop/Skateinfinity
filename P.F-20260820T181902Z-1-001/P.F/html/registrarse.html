<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skate∞ - Registrar</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div class="main-container">
        <header class="header">
            <h1 class="logo">Skate&infin;</h1>
        </header>

        <main class="login-wrapper">
            <div class="login-card register-card">
                <div class="card-header">
                    <h2>REGISTRAR USUARIO</h2>
                </div>
                <div class="card-body">
                    <form onsubmit="return validarFormulario(event);">
                        <div class="form-row">
                            <div class="input-group">
                                <input type="text" placeholder="Nombre Completo..." oninput="this.value = this.value.toLowerCase()" required>
                            </div>
                            <div class="input-group">
                                <input type="text" id="usuario" placeholder="Usuario..." 
                                       pattern="[a-zA-Z0-9]+" 
                                       title="El usuario solo puede contener letras y números, sin caracteres especiales." required>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="input-group">
                                <input type="tel" placeholder="Teléfono..." oninput="this.value = this.value.replace(/[^0-9]/g, '')" inputmode="numeric" required>
                            </div>
                            <div class="input-group">
                                <input type="text" placeholder="Fecha de Nacimiento..." onfocus="(this.type='date')" onblur="if(!this.value) this.type='text'" required>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="input-group">
                                <input type="email" id="email" placeholder="Correo Electrónico..." required>
                            </div>
                            <div class="input-group">
                                <input type="email" id="confirmEmail" placeholder="Confirmar Correo Electrónico..." required>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="input-group">
                                <div class="password-wrapper">
                                    <input type="password" id="password" placeholder="Contraseña..." 
                                           pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[\W_]).{8,}" 
                                           title="La contraseña debe tener más de 8 caracteres, al menos una mayúscula, una minúscula, un número y un símbolo." required>
                                    <button type="button" class="toggle-password" onclick="toggleVisibility('password', this)" title="Mostrar contraseña">🙈</button>
                                </div>
                            </div>
                            <div class="input-group">
                                <div class="password-wrapper">
                                    <input type="password" id="confirmPassword" placeholder="Confirmar Contraseña..." required>
                                    <button type="button" class="toggle-password" onclick="toggleVisibility('confirmPassword', this)" title="Mostrar contraseña">🙈</button>
                                </div>
                            </div>
                        </div>

                        <div class="button-group">
                            <button type="button" class="btn btn-register" onclick="window.location.href='iniciarsesion.html';">Regresar</button>
                            <button type="submit" class="btn btn-login">Registrarse</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>

        <footer class="footer">
            <p>&copy; 2026 Skate&infin;. Todos los derechos reservados.</p>
        </footer>
    </div>

    <script>
        function toggleVisibility(inputId, btn) {
            const input = document.getElementById(inputId);
            if (input.type === "password") {
                input.type = "text";
                btn.textContent = "🐵";
                btn.title = "Ocultar contraseña";
            } else {
                input.type = "password";
                btn.textContent = "🙈";
                btn.title = "Mostrar contraseña";
            }
        }

        function validarFormulario(event) {
            event.preventDefault();

            const email = document.getElementById('email').value;
            const confirmEmail = document.getElementById('confirmEmail').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (email !== confirmEmail) {
                alert("Los correos electrónicos no coinciden.");
                return false;
            }

            if (password !== confirmPassword) {
                alert("Las contraseñas no coinciden.");
                return false;
            }

            window.location.href = 'iniciarsesion.html';
            return true;
        }
    </script>
</body>
</html>
