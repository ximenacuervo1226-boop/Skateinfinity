<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skate∞ - Iniciar Sesion</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div class="main-container">
        <header class="header">
            <h1 class="logo">Skate&infin;</h1>
            <a href="principal.html" class="btn-home">Inicio</a>
        </header>

        <main class="login-wrapper">
            <div class="login-card">
                <div class="card-header">
                    <h2>Iniciar Sesion</h2>
                </div>
                <div class="card-body">
                    <form onsubmit="return validarLogin(event);">
                        <div class="input-group">
                            <input type="text" id="userInput" placeholder="Usuario o Correo Electronico..." required>
                        </div>

                        <div class="input-group">
                            <div class="password-wrapper">
                                <input type="password" id="password" placeholder="Contraseña..." 
                                       pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[\W_]).{8,}" 
                                       title="La contraseña debe tener más de 8 caracteres, al menos una mayúscula, una minúscula, un número y un símbolo." required>
                                <button type="button" class="toggle-password" onclick="toggleVisibility('password', this)" title="Mostrar contraseña">🙈</button>
                            </div>
                        </div>

                        <div class="forgot-password">
                            <a href="#">¿Olvidaste tu contraseña?</a>
                        </div>
                        <div class="button-group">
                            <button type="button" class="btn btn-register" onclick="window.location.href='registrarse.html';">Registrate</button>
                            <button type="submit" class="btn btn-login">Iniciar</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script>
        function toggleVisibility(inputId, btn) {
            const input = document.getElementById(inputId);
            if (input.type === "password") {
                input.type = "text";
                btn.textContent = "🐵";
                btn.title = "Ocultar contraseña";
            } else {
                input.type = "password";
                btn.textContent = "🙈";
                btn.title = "Mostrar contraseña";
            }
        }

        function validarLogin(event) {
            event.preventDefault();

            const userInput = document.getElementById('userInput').value.trim();

            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            const usernameRegex = /^[a-zA-Z0-9]+$/;

            const esCorreoValido = emailRegex.test(userInput);
            const esUsuarioValido = usernameRegex.test(userInput);

            if (!esCorreoValido && !esUsuarioValido) {
                alert("Ingresa un correo electrónico válido (con @) o un usuario que solo contenga letras y números sin caracteres especiales.");
                return false;
            }

            window.location.href = 'principal.html';
            return true;
        }
    </script>
</body>
</html>
