<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skate∞ - Iniciar Sesion</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div class="main-container">
        <header class="header">
            <h1 class="logo">Skate&infin;</h1>
            <a href="principal.html" class="btn-home">Inicio</a>
        </header>

        <main class="login-wrapper">
            <div class="login-card">
                <div class="card-header">
                    <h2>Iniciar Sesion</h2>
                </div>
                <div class="card-body">
                    <form onsubmit="event.preventDefault(); window.location.href='principal.html';">
                        <div class="input-group">
                            <input type="text" placeholder="Usuario o Correo Electronico..." required>
                        </div>
                        <div class="input-group">
                            <input type="password" placeholder="Contraseña..." required>
                        </div>
                        <div class="forgot-password">
                            <a href="#">¿Olvidaste tu contraseña?</a>
                        </div>
                        <div class="button-group">
                            <button type="button" class="btn btn-register" onclick="window.location.href='registrarse.html';">Registrate</button>
                            <button type="submit" class="btn btn-login">Iniciar</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
