<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skate∞ - Iniciar Sesion</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div class="main-container">
        <header class="header">
            <h1 class="logo">Skate&infin;</h1>
            <a href="principal.html" class="btn-home">Inicio</a>
        </header>

        <main class="login-wrapper">
            <div class="login-card">
                <div class="card-header">
                    <h2>Iniciar Sesion</h2>
                </div>
                <div class="card-body">
                    <form>
                        <div class="input-group">
                            <input type="text" id="userInput" name="usuario_correo" placeholder="Usuario o Correo Electronico..." required>
                        </div>

                        <div class="input-group">
                            <div class="password-wrapper">
                                <input type="password" id="password" name="password" placeholder="Contraseña..." 
                                       pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[\W_]).{8,}" 
                                       title="La contraseña debe tener más de 8 caracteres, al menos una mayúscula, una minúscula, un número y un símbolo." required>
                                <button type="button" class="toggle-password" title="Mostrar contraseña">🙈</button>
                            </div>
                        </div>

                        <div class="forgot-password">
                            <a href="#">¿Olvidaste tu contraseña?</a>
                        </div>
                        <div class="button-group">
                            <button type="button" class="btn btn-register">Registrate</button>
                            <button type="submit" class="btn btn-login">Iniciar</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>

        <footer class="auth-footer">
            <div class="footer-bottom">
                <p>Skate∞ © 2026. Todos los derechos reservados.</p>
            </div>
        </footer>
    </div>

    <script src="../js/usuario.js" defer></script>
</body>
</html>
